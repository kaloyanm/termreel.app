[project]
name = "backend"
version = "0.1.0"
description = "Video tutorial creator API — projects, playlists, scenario editor, render queue"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "rq>=2.0",
    "redis>=5.0",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false
